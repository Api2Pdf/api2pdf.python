[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api2pdf"
version = "2.2.0"
description = "Python client library for the Api2Pdf.com REST API."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Zack Schwartz", email = "support@api2pdf.com" }
]
dependencies = [
  "requests>=2.28"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = [
  "pytest>=8"
]

[project.urls]
Homepage = "https://github.com/Api2Pdf/api2pdf.python"
Documentation = "https://www.api2pdf.com/documentation/v2"
Repository = "https://github.com/Api2Pdf/api2pdf.python"

[tool.setuptools.packages.find]
include = ["api2pdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
